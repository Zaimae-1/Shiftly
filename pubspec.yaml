name: attendance_app
description: "Smart Attendance App - proyek course sekolah."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
  camera: ^0.11.0+2
  web: ^1.1.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.20.1
  lottie: ^3.3.1
  google_mlkit_face_detection: ^0.12.0
  cloud_firestore: ^5.6.3
  firebase_core: ^3.11.0
  image_picker: ^1.1.2
  tflite_flutter: 0.12.1
  image: 4.5.4
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/raw/
    - assets/models/
